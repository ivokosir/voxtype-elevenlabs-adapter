name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Format
        run: cargo +stable fmt --check
      - name: Lint
        run: cargo +stable clippy --all-targets -- -D warnings
      - name: Test
        run: cargo +stable test --locked
