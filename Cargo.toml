[package]
name = "voxtype-elevenlabs-adapter"
version = "0.1.0"
edition = "2024"
description = "A local compatibility adapter between Voxtype and ElevenLabs Scribe"
license = "MIT"
repository = "https://github.com/ivokosir/voxtype-elevenlabs-adapter"
rust-version = "1.85"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["multipart"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rpassword = "7.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["fs", "macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.20"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"

[profile.release]
lto = "thin"
strip = true
